<script id="lca-auth-reload-fix">
(function(){
  const LOGIN_KEYS=['LCA_ACTIVE_TOKEN','lca_token','token','authToken'];
  const USER_KEYS=['lca_account','account','currentAccount'];
  function getStored(keys){
    for(const k of keys){
      const v=localStorage.getItem(k)||sessionStorage.getItem(k);
      if(v)return v;
    }
    return null;
  }
  window.__lcaSessionToken=getStored(LOGIN_KEYS);
  window.__lcaSessionAccount=getStored(USER_KEYS);

  // Keep the login UI hidden until session restoration finishes.
  document.documentElement.classList.add('lca-auth-booting');
  const style=document.createElement('style');
  style.textContent='.lca-auth-booting #auth,.lca-auth-booting .login-screen{visibility:hidden!important;opacity:0!important;pointer-events:none!important}.lca-auth-ready #auth,.lca-auth-ready .login-screen{visibility:visible!important;opacity:1!important;pointer-events:auto!important}';
  (document.head||document.documentElement).appendChild(style);

  async function restore(){
    try{
      if(window.__lcaSessionToken){
        const r=await fetch('/api/me',{headers:{Authorization:'Bearer '+window.__lcaSessionToken}});
        if(r.ok){
          const d=await r.json();
          window.token=window.__lcaSessionToken;
          window.account=d.account||d.user||window.account;
          if(window.account){
            if(typeof token!=='undefined') token=window.token;
            if(typeof account!=='undefined') account=window.account;
            if(typeof showApp==='function') showApp();
            document.dispatchEvent(new Event('lca:session-restored'));
            localStorage.setItem('lca_token',window.token);
            localStorage.setItem('lca_account',JSON.stringify(window.account));
            document.documentElement.classList.add('lca-auth-ready');
            if(typeof render==='function')render();
            return;
          }
        }
      }
    }catch(e){}
    document.documentElement.classList.add('lca-auth-ready');
  }
  window.__lcaRestoreSession=restore;
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',restore,{once:true});
  else restore();
})();
</script>

function hasPlayingMedia(){return !!document.querySelector('audio,video')&&Array.from(document.querySelectorAll('audio,video')).some(m=>!m.paused&&!m.ended&&m.readyState>2)}
async function sync(){
  if(!token||pollInFlight)return;
  pollInFlight=true;
  try{
    const r=await fetch('/api/snapshot',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(r.status===403){const d=await r.json().catch(()=>({}));if(d.banned){showBanScreen(d.banUntil,d.banReason||'');return}throw Error(d.error||'session')}
    if(!r.ok)throw Error('session');
    const d=await r.json();
    const focused=document.activeElement?.id||'';
    const caret=(focused&&document.activeElement?.selectionStart!=null)?[document.activeElement.selectionStart,document.activeElement.selectionEnd]:null;
    account=d.account;
    if(!account.servers.some(s=>s.id===serverId))serverId=account.servers[0]?.id||'home';
    // Keep the existing chat DOM intact while audio/video is playing.
    // This preserves the media element and its playback position during quiet sync.
    if(!hasPlayingMedia()) render();
    if(focused&&$(focused)&&['INPUT','TEXTAREA'].includes($(focused).tagName)){$(focused).focus();if(caret)try{$(focused).setSelectionRange(caret[0],caret[1])}catch{}}
  }catch(e){if(!account){sessionStore().removeItem(TOKEN_KEY);localStorage.removeItem('lca_token');localStorage.removeItem('token');localStorage.removeItem('authToken');token='';account=null;showAuth()}}
  finally{pollInFlight=false}
}

function normalizedRole(){
  const r=String(account?.role||'').trim().toLowerCase().replace(/[_-]+/g,' ');
  if(r==='owner'||account?.isOwner||String(account?.username||'').trim().toLowerCase()==='ceoimanoob') return 'owner';
  if(r==='co owner'||r==='coowner'||account?.isCoOwner) return 'co-owner';
  return r;
}
function clientIsOwner(){return normalizedRole()==='owner'}

function clientCanOwnerPanel(){return clientIsOwner()||clientIsCoOwner()||Number(account?.ownerPanelTrialRemainingMs||0)>0}

async function createServer(){await createServerType(false)}
async function createVoiceServer(){await createServerType(true)}
async function createServerType(voiceOnly){
  if(!token||!account)return toast('Please log in first.');
  const name=prompt(voiceOnly?'Give your voice server a name:':'Give your server a name:');
  if(!name||!name.trim())return;
  const locked=confirm('Make this server private with a code?');
  let code='';
  if(locked){
    code=prompt('Choose a server code (4+ characters):')||'';
    if(code.length<4)return toast('Code must be at least 4 characters.');
  }
  try{
    const r=await fetch('/api/server',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({name:name.trim(),private:locked,code,voiceOnly})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)return toast(d.error||'Server creation failed.');
    await sync();
    serverId=d.server.id;
    render();
    toast(voiceOnly?'🎙️ Voice server created!':'✅ Server created!');
  }catch(e){
    toast('Could not connect to the server. Please try again.');
  }
}

  poll:()=>{if(!canPoll())return toast('Only Server Admin, Co-Owner, or Owner can create polls.');show('📊 Create Poll','<input id="lcaPollQ" class="field" placeholder="Question"><input id="lcaPollO" class="field" placeholder="Options separated by commas"><button class="btn primary" onclick="LCAFeatureUI.createPoll()">Create Poll</button>')},
  createPoll:async()=>{
    const q=document.getElementById('lcaPollQ')?.value.trim(),opts=(document.getElementById('lcaPollO')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);
    if(!q||opts.length<2)return toast('Enter a question and at least 2 options.');
    const sid=currentServer()?.id||serverId;
    const r=await fetch('/api/poll',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({serverId:sid,question:q,options:opts})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)return toast(d.error||'Poll failed.');
    await sync();closeModal();toast('📊 Poll created.');
  },
  slow:async()=>{
    if(!canSlow())return toast('Staff only.');
    const t=prompt('Slow mode delay in seconds (0 to disable):','5');
    if(t===null)return;
    const sid=currentServer()?.id||serverId,n=Number(t);
    if(!Number.isFinite(n)||n<0||n>3600)return toast('Choose 0–3600 seconds.');
    const r=await fetch('/api/server/settings',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({serverId:sid,slowModeSeconds:n})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)return toast(d.error||'Could not update slow mode.');
    await sync();toast('🐢 Slow mode updated.');
  },
  mute:()=>{if(!clientCanOwnerPanel())return toast('Only Co-Owner or Owner can mute.');show('🔇 Timed Mute','<input id="lcaMuteU" class="field" placeholder="Username"><input id="lcaMuteT" class="field" type="number" min="1" placeholder="Minutes"><button class="btn danger" onclick="LCAFeatureUI.doMute()">Mute</button>')},
  doMute:async()=>{
    const u=document.getElementById('lcaMuteU')?.value.trim().toLowerCase(),t=Number(document.getElementById('lcaMuteT')?.value);
    if(!u||u===account?.username)return toast('You cannot mute yourself.');
    if(!Number.isFinite(t)||t<1)return toast('Enter at least 1 minute.');
    const r=await fetch('/api/mod/mute',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({username:u,durationMinutes:t})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)return toast(d.error||'Mute failed.');
    closeModal();toast('🔇 User muted.');
  },
  icon:()=>{if(!clientCanOwnerPanel())return toast('Owner Panel access only.');show('🖼️ Server Icon','<input id="lcaIcon" class="field" placeholder="Paste an image URL"><button class="btn primary" onclick="LCAFeatureUI.saveIcon()">Save Icon</button>')},
  saveIcon:async()=>{
    const sid=currentServer()?.id||serverId,icon=document.getElementById('lcaIcon')?.value.trim();
    if(!icon)return toast('Enter an image URL.');
    const r=await fetch('/api/server/settings',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({serverId:sid,icon})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)return toast(d.error||'Could not save icon.');
    await sync();closeModal();toast('🖼️ Server icon saved.');
  },
  reportAbuse:()=>show('🚨 Report Staff Abuse','<p class="muted">Send suspected staff abuse directly to the Owner Mailbox.</p><input id="lcaAbuseStaff" class="field" placeholder="Staff username"><input id="lcaAbuseReason" class="field" placeholder="Reason"><button class="btn danger" onclick="LCAFeatureUI.sendAbuse()">Send Report</button>'),
  sendAbuse:async()=>{
    const staff=document.getElementById('lcaAbuseStaff')?.value.trim(),reason=document.getElementById('lcaAbuseReason')?.value.trim();
    if(!staff||!reason)return toast('Enter the staff username and reason.');
    const r=await fetch('/api/owner/staff-abuse',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({staff,reason})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)return toast(d.error||'Could not send report.');
    closeModal();toast('📨 Sent to the Owner Mailbox.');
  }
 };
 function updateFeatureVisibility(){
   document.querySelectorAll('.staffOnlyFeature').forEach(b=>{
     const f=b.dataset.feature;
     b.classList.toggle('hidden',(f==='poll'&&!canPoll())||(f==='slow'&&!canSlow()));
   });
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',updateFeatureVisibility);else updateFeatureVisibility();
 window.addEventListener('lca:rendered',updateFeatureVisibility);
})();
</script>

<script id="lca-feature-pack">
(function(){
const F={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(u,o={}){const authToken=(typeof token!=='undefined'&&token)||window.token||localStorage.getItem('lca_token')||'';if(!authToken){if(window.__lcaRestoreSession)await window.__lcaRestoreSession();}const finalToken=(typeof token!=='undefined'&&token)||window.token||localStorage.getItem('lca_token')||'';o.headers={...(o.headers||{}),Authorization:'Bearer '+finalToken};if(o.body&&typeof o.body!=='string'){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(r.status===401&&window.__lcaRestoreSession){const ok=await window.__lcaRestoreSession();if(ok){o.headers.Authorization='Bearer '+((typeof token!=='undefined'&&token)||window.token||localStorage.getItem('lca_token')||'');const r2=await fetch(u,o),d2=await r2.json().catch(()=>({}));if(r2.ok)return d2;throw Error(d2.error||'Request failed')}}if(!r.ok)throw Error(d.error||'Request failed');return d}
function show(t,b){if(typeof modal==='function')modal('<div class="featureModalScroll"><div class="popupHead"><h2>'+t+'</h2></div>'+b+'</div>');else alert(t)}
function petImg(p,size=52){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#17375c"/><stop offset="1" stop-color="#0b1727"/></linearGradient></defs><rect x="2" y="2" width="96" height="96" rx="20" fill="url(#g)" stroke="#4a78b8" stroke-width="3"/><text x="50" y="65" text-anchor="middle" font-size="48">${p.emoji||'🐾'}</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}
function rarityMeta(p,d){return (d.rarities||[]).find(r=>r.id===p.rarity)||{name:p.rarity,token:0,diamonds:0,value:0,pointMult:1,diamondMult:1,tokenMult:1}}
function petCard(p,d,owned=false,compact=false){const r=rarityMeta(p,d);const eq=(d.equipped||[]).includes(p.id);return `<div class="featurePet ${p.rarity}" style="display:flex;gap:10px;align-items:center;${compact?'padding:8px':''}"><img src="${petImg(p,compact?42:56)}" alt="${esc(p.name)}" style="width:${compact?42:56}px;height:${compact?42:56}px;border-radius:12px;flex:none"><div style="min-width:0;flex:1"><h3 style="margin:0">${esc(p.name)}</h3><div class="muted">${esc(r.name)} · Value ${p.value.toLocaleString()}</div><div class="muted">⭐ ×${p.pointMult} ${p.diamondMult>1?`· 💎 ×${p.diamondMult}`:''} ${p.tokenMult>1?`· 🪙 ×${p.tokenMult}`:''}</div></div>${owned?`<button class="btn ${eq?'danger':'primary'}" onclick="LCAFeaturePack.${eq?'unequip':'equip'}('${esc(p.id)}')">${eq?'Unequip':'Equip'}</button>`:''}</div>`}
F.openHub=()=>show('✨ Feature Hub',`<div class="featureHubGrid"><div class="featureCard"><h3>🐾 Pets</h3><p>100 named pets, rerolls, equips, multipliers, guide and values.</p><button class="btn primary" onclick="LCAFeaturePack.pets()">Marketplace</button> <button class="btn" onclick="LCAFeaturePack.petGuide()">Guide</button> <button class="btn" onclick="LCAFeaturePack.equipped()">Equipped</button></div><div class="featureCard"><h3>🏪 Trading Plaza</h3><p>Two-sided offers, pet values, accept/decline, selling and bidding.</p><button class="btn primary" onclick="LCAFeaturePack.trading()">Open Trading</button></div><div class="featureCard"><h3>🏆 Progress</h3><p>100 achievements, badges and leaderboards.</p><button class="btn primary" onclick="LCAFeaturePack.achievements()">Achievements</button> <button class="btn" onclick="LCAFeaturePack.leaderboards()">Leaderboards</button></div><div class="featureCard"><h3>🎁 Rewards</h3><button class="btn primary" onclick="LCAFeaturePack.dailyRewards()">Daily Rewards</button> <button class="btn" onclick="LCAFeaturePack.challenges()">Challenges</button></div><div class="featureCard"><h3>🎙️ Messaging</h3><button class="btn primary" onclick="LCAFeaturePack.messaging()">Open</button></div><div class="featureCard"><h3>👤 Social</h3><button class="btn primary" onclick="LCAFeaturePack.social()">Open</button></div></div>`);
F.messaging=()=>show('💬 Messaging Tools',`<div class="featureBar"><button class="btn" onclick="LCAFeaturePack.voice()">🎙️ Mic Options</button><button class="btn" onclick="LCAFeaturePack.schedule()">🕒 Schedule</button><button class="btn" onclick="LCAFeaturePack.reminders()">🔔 Reminders</button></div><textarea id="fpDraft" class="field" rows="4" placeholder="Draft message...">${esc(localStorage.getItem('lcaDraft')||'')}</textarea><button class="btn primary" onclick="localStorage.setItem('lcaDraft',document.getElementById('fpDraft').value);toast('Draft saved.')">Save Draft</button>`);
F.voice=()=>show('🎙️ Mic Options',`<div class="featureBar"><button class="btn primary" onclick="LCAFeaturePack.recordVoice()">🎙️ Voice Record</button><button class="btn primary" onclick="LCAFeaturePack.voiceToText()">🗣️ Voice → Text</button></div>`);
F.recordVoice=async()=>{try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),r=new MediaRecorder(st),c=[];r.ondataavailable=e=>c.push(e.data);r.onstop=()=>{st.getTracks().forEach(t=>t.stop());const url=URL.createObjectURL(new Blob(c,{type:'audio/webm'}));show('🎙️ Voice Recording',`<audio controls src="${url}" style="width:100%"></audio>`)};r.start();setTimeout(()=>r.state==='recording'&&r.stop(),30000);toast('Recording started.')}catch(e){toast('Microphone unavailable.')}};
F.voiceToText=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice-to-text is not supported here.');const r=new SR();r.lang='en-US';r.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript+' ';const q=document.querySelector('textarea[placeholder*="Message"],textarea');if(q){q.value+=(q.value?' ':'')+t.trim();q.dispatchEvent(new Event('input',{bubbles:true}))}};r.start();toast('Listening...')};
F.schedule=()=>show('🕒 Scheduled Message',`<input id="fpst" class="field" placeholder="Message"><input id="fpsw" class="field" type="datetime-local"><button class="btn primary" onclick="LCAFeaturePack.doSchedule()">Schedule</button>`);
F.doSchedule=async()=>{try{await api('/api/scheduled-message',{method:'POST',body:{server:(typeof serverId!=='undefined'&&serverId)||'home',text:document.getElementById('fpst').value,when:new Date(document.getElementById('fpsw').value).getTime()}});toast('Scheduled.')}catch(e){toast(e.message)}};
F.reminders=async()=>{try{const d=await api('/api/reminders');show('🔔 Reminders',`<input id="fprt" class="field" placeholder="Reminder"><input id="fprw" class="field" type="datetime-local"><button class="btn primary" onclick="LCAFeaturePack.addReminder()">Add</button>${(d.reminders||[]).map(x=>`<div class="featureCard">${esc(x.text)}<div class="muted">${new Date(x.when).toLocaleString()}</div></div>`).join('')}`)}catch(e){toast(e.message)}};
F.addReminder=async()=>{try{await api('/api/reminders',{method:'POST',body:{text:document.getElementById('fprt').value,when:new Date(document.getElementById('fprw').value).getTime()}});F.reminders()}catch(e){toast(e.message)}};
F.social=async()=>{const d=await api('/api/snapshot');show('👤 Social',`<div class="featureCard"><h3>Custom Status</h3><input id="fpstatus" class="field" value="${esc(d.account.status||'')}" placeholder="Gaming 🎮 / Busy 🔴 / AFK"><button class="btn primary" onclick="LCAFeaturePack.saveStatus()">Save</button></div><div class="featureCard"><h3>Follow</h3><input id="fpfollow" class="field" placeholder="username"><button class="btn primary" onclick="LCAFeaturePack.follow()">Follow / Unfollow</button></div>`)};
F.saveStatus=async()=>{try{await api('/api/features/status',{method:'POST',body:{status:document.getElementById('fpstatus').value}});toast('Status saved.')}catch(e){toast(e.message)}};F.follow=async()=>{try{await api('/api/features/follow',{method:'POST',body:{username:document.getElementById('fpfollow').value}});toast('Follow list updated.')}catch(e){toast(e.message)}};
F.achievements=async()=>{try{const d=await api('/api/features/achievements'),g={};d.achievements.forEach(x=>(g[x.category]??=[]).push(x));show('🏆 Achievements & Badges',`<p class="muted">Every badge shows exactly what you need to do. You cannot claim a badge until the requirement is actually complete.</p>${Object.entries(g).map(([k,a])=>`<h3>${k}</h3><div class="featureHubGrid">${a.map(x=>{const p=x.progress||{value:0,target:1,complete:false};return `<div class="featureCard"><b>${esc(x.name)}</b><p>${esc(x.description)}</p><div class="muted">Progress: ${p.value.toLocaleString()} / ${p.target.toLocaleString()}</div><div style="margin-top:6px">${x.unlocked?'🏅 Claimed':p.complete?'✅ Ready to claim':'🔒 Locked'}</div>${x.unlocked?'':`<button class="btn ${p.complete?'primary':''}" ${p.complete?'':'disabled'} onclick="LCAFeaturePack.unlock('${x.id}')">${p.complete?'Claim Badge':'Complete Requirement'}</button>`}</div>`}).join('')}</div>`).join('')}`)}catch(e){toast(e.message)}};
F.unlock=async id=>{try{await api('/api/features/achievements/unlock',{method:'POST',body:{id}});toast('🏅 Badge claimed!');F.achievements()}catch(e){toast(e.message)}};
F.dailyRewards=async()=>{try{const d=await api('/api/features/rewards');const next=Number(d.nextRewardAt||Date.now());show('🎁 Daily Rewards',`<div class="featureCard"><h3>Next reward</h3><div id="dailyCountdown" style="font-size:24px;font-weight:900;color:#ffd45a">Calculating...</div><div class="muted">The next calendar reward becomes available at the reset.</div></div><p class="muted">Calendar streak: ${d.streak}. Next day: ${Math.min(d.streak+1,31)}.</p><div class="featureCalendar">${d.calendar.map(x=>`<div class="featureDay ${x.claimed?'claimed':''} ${x.available?'available':''}"><b>${x.day}</b><div>${x.claimed?'✓':x.available?'🎁':'🔒'}</div></div>`).join('')}</div><button class="btn primary" ${d.canClaim?'':'disabled'} onclick="LCAFeaturePack.claimReward()">${d.canClaim?'Claim Today\'s Reward':'Already Claimed Today'}</button>`);const el=document.getElementById('dailyCountdown');if(el){const tick=()=>{let ms=Math.max(0,next-Date.now()),sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),ss=sec%60;el.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`};tick();if(window.__lcaDailyTimer)clearInterval(window.__lcaDailyTimer);window.__lcaDailyTimer=setInterval(tick,1000)}}catch(e){toast(e.message)}};
F.claimReward=async()=>{try{const d=await api('/api/features/rewards/claim',{method:'POST'});account.points=d.points;renderPoints();toast('🎁 Reward claimed!');F.dailyRewards()}catch(e){toast(e.message)}};
F.challenges=async()=>{try{const d=await api('/api/features/challenges');const allClaimed=['daily','weekly','monthly'].every(t=>d.current[t].claimed);const cards=['daily','weekly','monthly'].map(t=>{const x=d.current[t],p=x.progress||{value:0,target:1,complete:false};const icon=t==='monthly'?'📅':t==='weekly'?'🗓️':'☀️';const rewardParts=[`⭐ ${Number(x.reward||0).toLocaleString()}`];if(x.rewardDiamonds)rewardParts.push(`💎 ${Number(x.rewardDiamonds).toLocaleString()}`);if(x.rewardTokens)rewardParts.push(`🪙 ${Number(x.rewardTokens).toLocaleString()}`);return `<div class="featureCard"><h3>${icon} ${t.toUpperCase()}</h3><b>${esc(x.name)}</b><p>${esc(x.description)}</p><div class="muted">Progress: ${p.value.toLocaleString()} / ${p.target.toLocaleString()}</div><p>Reward: ${rewardParts.join(' · ')}</p><button class="btn ${p.complete&&!x.claimed?'primary':''}" ${p.complete&&!x.claimed?'':'disabled'} onclick="LCAFeaturePack.claimChallenge('${t}')">${x.claimed?'Claimed':p.complete?'Claim Reward':'Keep Going'}</button></div>`}).join('');show('🎯 Challenges',`<div class="featureCard"><h3>🎯 Challenge Rewards</h3><p class="muted">Rewards are balanced by difficulty. Daily rewards are small, weekly rewards are stronger, and monthly rewards are the biggest. Monthly challenges can include Diamonds and Owner Tokens.</p><div class="muted">Complete and claim all 3 current challenges to unlock one reroll.</div><button class="btn ${d.reroll?.available?'primary':''}" ${d.reroll?.available?'':'disabled'} onclick="LCAFeaturePack.rerollChallenges()">${d.reroll?.used?'🔒 Reroll Used Today':d.reroll?.available?'🔄 Reroll All Challenges':'🔒 Complete All 3 Challenges First'}</button></div><div class="featureHubGrid">${cards}</div>`)}catch(e){toast(e.message)}};
F.claimChallenge=async t=>{try{const d=await api('/api/features/challenges/claim',{method:'POST',body:{type:t}});account.points=d.points;account.diamonds=d.diamonds;account.ownerTokens=d.ownerTokens;renderPoints();toast(`🎯 Reward claimed! +${d.reward} pts${d.rewardDiamonds?` +${d.rewardDiamonds} 💎`:''}${d.rewardTokens?` +${d.rewardTokens} 🪙`:''}`);F.challenges()}catch(e){toast(e.message)}};
F.rerollChallenges=async()=>{try{await api('/api/features/challenges/reroll',{method:'POST'});toast('🔄 All 3 challenges rerolled!');F.challenges()}catch(e){toast(e.message)}};
F.pets=async()=>{try{const d=await api('/api/features/pets');const owned=new Set(d.owned||[]),cards=d.pets.map(p=>{const r=rarityMeta(p,d),isOwned=owned.has(p.id);return `<div class="featurePet ${p.rarity}" style="display:grid;grid-template-columns:64px 1fr;gap:10px"><img src="${petImg(p,60)}" alt="${esc(p.name)}" style="width:60px;height:60px;border-radius:14px"><div><h3 style="margin:0">${esc(p.name)}</h3><div class="muted">${r.name} · ${Number(r.chance||0)}% shop chance · Trade Value ${p.value.toLocaleString()}</div><div class="muted">⭐ ×${p.pointMult} ${p.diamondMult>1?`· 💎 ×${p.diamondMult}`:''} ${p.tokenMult>1?`· 🪙 ×${p.tokenMult}`:''}</div><div style="margin-top:7px">${isOwned?'<button class="btn" disabled>Owned</button>':`<button class="btn primary" onclick="LCAFeaturePack.buyPet('${esc(p.id)}','token')">${r.token} 🪙</button> <button class="btn" onclick="LCAFeaturePack.buyPet('${esc(p.id)}','diamond')">${r.diamonds} 💎</button>`}</div></div></div>`}).join('');show('🐾 Pet Marketplace',`<div class="featureCard"><h3>🎲 Random Market</h3><p class="muted">Every refresh independently rolls each slot using the rarity chances. Pets in the same market are never duplicated. Buying a pet is permanent and each pet can only be owned once.</p><div class="featureBar"><button class="btn primary" onclick="LCAFeaturePack.reroll('token')">🔄 Reroll — 10 🪙</button><button class="btn" onclick="LCAFeaturePack.reroll('diamond')">🔄 Reroll — 200 💎</button><button class="btn primary" onclick="LCAFeaturePack.roll('token')">✨ LEGENDARY ROLL — 100 🪙</button><button class="btn" onclick="LCAFeaturePack.roll('diamond')">✨ LEGENDARY ROLL — 2,000 💎</button></div><div class="muted">Rarity odds: Common 40% · Uncommon 30% · Rare 20% · Epic 6% · Legendary 3% · GOD 1%</div></div><div class="featureBar"><button class="btn" onclick="LCAFeaturePack.petGuide()">📖 All 100 Pets</button><button class="btn" onclick="LCAFeaturePack.equipped()">⚡ Equip / Unequip</button></div><div class="featureHubGrid">${cards}</div>`)}catch(e){toast(e.message)}};
F.buyPet=async(id,pay)=>{try{const d=await api('/api/features/pets/buy',{method:'POST',body:{id,pay}});account.diamonds=d.diamonds;account.ownerTokens=d.ownerTokens;account.pets=d.owned;renderPoints();toast(`🐾 ${d.pet.name} bought!`);F.pets()}catch(e){toast(e.message)}};
F.reroll=async type=>{try{const d=await api('/api/features/pets/reroll',{method:'POST',body:{type}});account.diamonds=d.diamonds;account.ownerTokens=d.ownerTokens;renderPoints();toast('🎲 New random market rolled!');F.pets()}catch(e){toast(e.message)}};
F.roll=async pay=>{try{const d=await api('/api/features/pets/legendary-roll',{method:'POST',body:{pay}});account.diamonds=d.diamonds;account.ownerTokens=d.ownerTokens;account.pets=d.owned;renderPoints();toast(`✨ ${d.pet.rarity.toUpperCase()}: ${d.pet.name}`);F.equipped()}catch(e){toast(e.message)}};
F.equipped=async()=>{try{const d=await api('/api/features/pets/equipped'),guide=await api('/api/features/pets/guide'),pets=(account.pets||[]).map(id=>guide.pets.find(p=>p.id===id)).filter(Boolean);show('⚡ Equipped Pets & Multipliers',`<div class="featureCard"><h3>Current Multipliers</h3><div>⭐ Points ×${d.stats.point} · 💎 Diamonds ×${d.stats.diamond} · 🪙 Owner Tokens ×${d.stats.token}</div><p class="muted">Rare–GOD can boost Diamonds. Legendary–GOD can boost Owner Tokens. Up to 3 pets equipped.</p></div><h3>Equipped</h3><div class="featureHubGrid">${(d.equipped||[]).map(id=>{const p=guide.pets.find(x=>x.id===id);return p?petCard(p,guide,true):''}).join('')||'<p class="muted">No pets equipped. Choose Equip below.</p>'}</div><h3>Your Pet Inventory</h3><div class="featureHubGrid">${pets.map(p=>petCard(p,guide,true)).join('')||'<p class="muted">Buy pets from the marketplace first.</p>'}</div>`)}catch(e){toast(e.message)}};
F.equip=async id=>{try{await api('/api/features/pets/equip',{method:'POST',body:{id}});toast('⚡ Pet equipped!');F.equipped()}catch(e){toast(e.message)}};F.unequip=async id=>{try{await api('/api/features/pets/unequip',{method:'POST',body:{id}});toast('↩️ Pet unequipped!');F.equipped()}catch(e){toast(e.message)}};
F.petGuide=async()=>{try{const d=await api('/api/features/pets/guide');const groups={};d.pets.forEach(p=>(groups[p.rarity]??=[]).push(p));show('📖 Pet Guide — All 100 Pets',`<p class="muted">Every pet has an image, rarity, trade value, point multiplier and eligible currency multipliers.</p>${Object.entries(groups).map(([r,arr])=>`<h3>${esc(r.toUpperCase())} (${arr.length})</h3><div class="featureHubGrid">${arr.map(p=>`<div class="featureCard" style="display:flex;gap:10px;align-items:center"><img src="${petImg(p,64)}" style="width:64px;height:64px;border-radius:14px"><div><b>${esc(p.name)}</b><div class="muted">Value: ${p.value.toLocaleString()}</div><div>⭐ ×${p.pointMult}${p.diamondMult>1?` · 💎 ×${p.diamondMult}`:''}${p.tokenMult>1?` · 🪙 ×${p.tokenMult}`:''}</div></div></div>`).join('')}</div>`).join('')}`)}catch(e){toast(e.message)}};

function tradePetById(id){return (window.__tradeGuide||[]).find(x=>x.id===id)}
F.trading=async()=>{try{const d=await api('/api/features/trading');window.__tradeGuide=d.values||[];const online=(d.players||[]).filter(x=>x.online),offline=(d.players||[]).filter(x=>!x.online);const playerRow=x=>`<div class="featureCard" style="display:flex;align-items:center;gap:10px"><span style="font-size:20px">${x.online?'🟢':'⚫'}</span><div style="flex:1"><b>${esc(x.name)}</b><div class="muted">@${esc(x.username)} · ${x.pets} pets · ${x.online?'Online':'Offline'}</div></div><button class="btn primary" ${x.online?'':'disabled'} onclick="LCAFeaturePack.requestTradeWith('${esc(x.username)}')">Trade</button></div>`;const pending=(d.pending||[]).map(t=>`<div class="featureCard"><b>🤝 Trade request from @${esc(t.fromName)}</b><div class="featureBar"><button class="btn primary" onclick="LCAFeaturePack.acceptTrade('${t.id}')">Accept</button><button class="btn danger" onclick="LCAFeaturePack.declineTrade('${t.id}')">Decline</button></div></div>`).join('');const active=(d.active||[]).map(t=>F.tradePanel(t,d)).join('');const listings=(d.listings||[]).map(x=>`<div class="featureCard" style="display:flex;gap:12px;align-items:center"><img src="${petImg(x.pet,52)}" style="width:52px;height:52px;border-radius:12px"><div style="flex:1"><b>${esc(x.pet?.name||x.petId)}</b><div class="muted">@${esc(x.seller)} · Value ${Number(x.value||0).toLocaleString()}</div><div>💎 Ask: ${Number(x.price).toLocaleString()}</div></div><button class="btn primary" onclick="LCAFeaturePack.bid('${x.id}',${x.price})">Buy / Bid</button></div>`).join('');show('🏪 Trading Plaza',`<div class="featureCard"><h3>🟢 Online Players</h3>${online.map(playerRow).join('')||'<p class="muted">No other players are online.</p>'}<h3 style="margin-top:18px">⚫ Offline Players</h3>${offline.map(playerRow).join('')||'<p class="muted">No offline accounts found.</p>'}</div>${pending}<h3>Active Trades</h3>${active||'<p class="muted">No active trades. Pick an online player above to send a request.</p>'}<h3>Marketplace Listings</h3>${listings||'<p class="muted">No listings yet.</p>'}`)}catch(e){toast(e.message)}};
F.requestTradeWith=async username=>{try{await api('/api/features/trading/request',{method:'POST',body:{target:username}});toast('🤝 Trade request sent!');F.trading()}catch(e){toast(e.message)}};
F.newTrade=async()=>{try{const d=await api('/api/features/trading');show('🤝 New Trade',`<p class="muted">Select an online player. Offline players cannot receive a trade request.</p>${(d.players||[]).map(x=>`<button class="btn" style="width:100%;margin:5px 0;text-align:left" ${x.online?'':'disabled'} onclick="LCAFeaturePack.requestTradeWith('${esc(x.username)}')">${x.online?'🟢':'⚫'} ${esc(x.name)} <span class="muted">@${esc(x.username)}</span></button>`).join('')}`)}catch(e){toast(e.message)}};
F.sendTradeRequest=F.requestTradeWith;
F.acceptTrade=async id=>{try{await api('/api/features/trading/accept-request',{method:'POST',body:{id}});toast('🤝 Trade opened!');F.trading()}catch(e){toast(e.message)}};F.declineTrade=async id=>{try{await api('/api/features/trading/decline',{method:'POST',body:{id}});F.trading()}catch(e){toast(e.message)}};
F.tradePanel=t=>{const guide=window.__tradeGuide||[],meIsFrom=t.from===account.username,mine=meIsFrom?(t.offer||[]):(t.request||[]),theirs=meIsFrom?(t.request||[]):(t.offer||[]),otherName=meIsFrom?t.toName:t.fromName,total=a=>a.reduce((n,p)=>n+(p.value||0),0),renderPet=(p,remove=false)=>remove?`<button class="btn" style="display:flex;gap:7px;align-items:center;width:100%;margin:5px 0;text-align:left" onclick="LCAFeaturePack.removeTradePet('${t.id}','${esc(p.id)}')"><img src="${petImg(p,34)}" style="width:34px;height:34px;border-radius:8px">${esc(p.name)}<span class="spacer"></span><span class="petValue">${p.value.toLocaleString()}</span></button>`:`<div class="btn" style="display:flex;gap:7px;align-items:center;width:100%;margin:5px 0;text-align:left"><img src="${petImg(p,34)}" style="width:34px;height:34px;border-radius:8px">${esc(p.name)}<span class="spacer"></span><span class="petValue">${p.value.toLocaleString()}</span></div>`,ready=meIsFrom?t.fromAccepted:t.toAccepted;return `<div class="featureCard" style="border:2px solid #31527c"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="petTradeSide"><h3>👤 You</h3><div class="muted">Your Offer · Value ${total(mine).toLocaleString()}</div>${mine.map(p=>renderPet(p,true)).join('')||'<p class="muted">Add pets from your inventory.</p>'}</div><div class="petTradeSide"><h3>👤 ${esc(otherName)}</h3><div class="muted">Their Offer · Value ${total(theirs).toLocaleString()}</div>${theirs.map(p=>renderPet(p,false)).join('')||'<p class="muted">Waiting for their pets.</p>'}</div></div><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:10px"><b>Value Difference: ${Math.abs(total(mine)-total(theirs)).toLocaleString()}</b><span class="muted">${ready?'You are ready':'You are not ready'}</span></div><div class="featureBar"><button class="btn primary" onclick="LCAFeaturePack.addTradePet('${t.id}')">➕ Inventory</button><button class="btn ${ready?'danger':'primary'}" onclick="LCAFeaturePack.readyTrade('${t.id}',${!ready})">${ready?'Unready':'Accept'}</button><button class="btn danger" onclick="LCAFeaturePack.declineTrade('${t.id}')">Decline</button></div></div>`};
F.addTradePet=async id=>{try{const d=await api('/api/features/trading');const active=(d.active||[]).find(t=>t.id===id);if(!active)return;const guide=d.values||[];const offered=new Set((active.from===account.username?active.offer:active.request).map(p=>p.id));const owned=(account.pets||[]).map(x=>guide.find(p=>p.id===x)).filter(Boolean).filter(p=>!offered.has(p.id));show('🎒 Your Pet Inventory',`<p class="muted">Click a pet to place it into the trade. Each pet can only appear once.</p><div class="featureHubGrid">${owned.map(p=>`<button class="btn" style="display:flex;gap:8px;align-items:center;text-align:left" onclick="LCAFeaturePack.addTradePetNow('${id}','${esc(p.id)}')"><img src="${petImg(p,48)}" style="width:48px;height:48px;border-radius:10px"><span><b>${esc(p.name)}</b><br><small>Value ${p.value.toLocaleString()}</small></span></button>`).join('')||'<p class="muted">No available pets.</p>'}</div>`)}catch(e){toast(e.message)}};
F.addTradePetNow=async(id,petId)=>{try{await api('/api/features/trading/add',{method:'POST',body:{id,petId}});F.trading()}catch(e){toast(e.message)}};F.removeTradePet=async(id,petId)=>{try{await api('/api/features/trading/remove',{method:'POST',body:{id,petId}});F.trading()}catch(e){toast(e.message)}};F.readyTrade=async(id,ready)=>{try{const d=await api('/api/features/trading/ready',{method:'POST',body:{id,ready}});if(d.completed){account.pets=d.owned;toast('✅ Trade completed!');renderPoints()}F.trading()}catch(e){toast(e.message)}};
F.listPet=async()=>{const d=await api('/api/features/trading');const owned=(account.pets||[]).map(x=>d.values.find(p=>p.id===x)).filter(Boolean);show('💰 Sell a Pet',`<div class="featureHubGrid">${owned.map(p=>`<div class="featureCard"><img src="${petImg(p,60)}" style="width:60px;height:60px;border-radius:12px"><b>${esc(p.name)}</b><div class="muted">Value ${p.value.toLocaleString()}</div><input id="price_${esc(p.id)}" class="field" type="number" min="1" placeholder="Diamond asking price"><button class="btn primary" onclick="LCAFeaturePack.doList('${esc(p.id)}')">List</button></div>`).join('')||'<p class="muted">No pets to sell.</p>'}</div>`)};
F.doList=async id=>{try{const el=document.getElementById('price_'+id);await api('/api/features/trading/list',{method:'POST',body:{petId:id,price:Number(el.value)}});toast('Listed!');F.trading()}catch(e){toast(e.message)}};
F.bid=async(id,b)=>{try{await api('/api/features/trading/bid',{method:'POST',body:{id,bid:b}});toast('Listing purchased.');F.trading()}catch(e){toast(e.message)}};
F.leaderboards=async()=>{try{const d=await api('/api/features/leaderboard');show('🏆 Leaderboards',Object.entries(d).map(([k,a])=>`<h3>${k}</h3><div class="featureHubGrid">${a.slice(0,10).map((x,i)=>`<div class="featureCard"><b>#${i+1} ${esc(x.name||x.username)}</b><div>${x[k]??0}</div></div>`).join('')}</div>`).join(''))}catch(e){toast(e.message)}};
window.LCAFeaturePack=F;
})();
</script>

<script id="lca-feature-auth-guard">
window.ensureLCAAuth=async function(){
  if(typeof token!=='undefined' && token && typeof account!=='undefined' && account)return true;
  if(window.__lcaRestoreSession){
    await window.__lcaRestoreSession();
    if(typeof token!=='undefined' && token && typeof account!=='undefined' && account)return true;
  }
  return false;
};
document.addEventListener('click',async function(e){
  const b=e.target.closest('button,[data-feature]');
  if(!b)return;
  const t=(b.textContent||'').toLowerCase();
  const feature=/achievement|daily|challenge|pet|trading|thread|schedule|draft|translate|remind|status|follow|audit|level|leaderboard|reward/.test(t);
  if(feature && !(typeof token!=='undefined' && token)){
    e.preventDefault();
    const ok=await window.ensureLCAAuth();
    if(!ok) return;
    b.click();
  }
},true);
</script>
