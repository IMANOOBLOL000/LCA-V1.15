<section id="auth">

<main class="main"><div class="channelHead"><span id="channelTitle" class="channelTitle">Home</span><span id="channelDesc" class="muted" style="margin-left:10px">Chat with people</span></div><div id="messages" class="messages"></div><div class="composer"><div id="emojiBar" class="emojiBar"></div><div id="preview"></div><div class="composeBox"><button class="iconBtn" onclick="pickFiles()">＋</button><input id="fileInput" type="file" multiple accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx,.zip" style="display:none" onchange="previewFiles(this.files)"><button class="iconBtn" onclick="toggleEmoji()">😀</button><input id="messageInput" placeholder="Message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"><button id="micBtn" class="iconBtn" onclick="voiceMessage()">🎙️</button><button class="iconBtn" onclick="sendMessage()">➤</button></div></div></main>

<script>
/* LCA offline/file:// mode: lets index.html run from Downloads without a Node server. */
if(location.protocol==='file:'){
  const _fetch=window.fetch;
  const LOCAL_DB_KEY='LCA_LOCAL_DB_V1_FRESH';
  const OWNER='ceoimanoob', OWNER_PASS='1031121';
  const clone=o=>JSON.parse(JSON.stringify(o));
  const h=s=>{let x=0;for(let i=0;i<String(s).length;i++)x=((x<<5)-x+String(s).charCodeAt(i))|0;return String(x>>>0)};

function renderMessages(){const s=currentServer();const locked=s?.isUpdateLog&&!account.isOwner;$('channelTitle').textContent=s?.name||'Home';$('channelDesc').textContent=s?.isUpdateLog?'Owner-only update log':(s?.private?'Private server':'Chat with people');$('messageInput').disabled=!!locked;$('messageInput').placeholder=locked?'Only the owner can post updates here.':'Message...';$('micBtn').disabled=!!locked;const announcement=account.announcements?.[s?.id];const global=account.globalNotice&&Number(account.globalNotice.expiresAt)>Date.now()?`<div class="serverAnnouncement" style="border-color:#d85b5b;background:linear-gradient(135deg,#3a1418,#211015)"><div class="announcementIcon">🌎</div><div><b>GLOBAL NOTICE</b><div class="announcementText">${esc(account.globalNotice.text)}</div><div class="announcementMeta">This notice is shown in every server for 10 seconds.</div></div></div>`:'';const banner=announcement?`<div class="serverAnnouncement"><div class="announcementIcon">📢</div><div><b>SERVER ANNOUNCEMENT</b><div class="announcementText">${esc(announcement.text)}</div><div class="announcementMeta">Posted by ${esc(announcement.by||'Staff')} · ${esc(new Date(announcement.updatedAt).toLocaleString())}</div></div></div>`:'';const ms=(account.messages||[]).filter(m=>m.server===s?.id);if(!ms.length){$('messages').innerHTML=global+banner+'<div class="empty">No messages yet.<br>Say hello 👋</div>';return}const wasNearBottom=($('messages').scrollHeight-$('messages').scrollTop-$('messages').clientHeight)<80;const oldScroll=$('messages').scrollTop;$('messages').innerHTML=global+banner+ms.map(m=>{const isMine=m.username===account.username,authorProfile=(account.membersByServer?.[s?.id]||[]).find(x=>x.username===m.username),authorRole=authorProfile?.role||'user',canStaff=staffCanCurrent()&&!isMine&&authorRole==='user',showSelfEdit=isMine&&!account.isOwner&&!s?.isUpdateLog,showOriginal=!!m.originalText&&m.userEdited&&!account.isOwner;return `<div class="msg"><div class="avatar">${esc(initials(m.name))}</div><div class="msgbody"><div class="msghead"><span class="msgname" onclick="openUser('${esc(m.username)}')">${esc(m.name)}</span><span class="time">${esc(m.time)}</span>${m.editedAt?'<span class="edited">edited</span>':''}${m.pinned?'<span class="ownerTag">📌 PINNED</span>':''}${account.isOwner?`<button class="btn" style="padding:3px 6px;font-size:11px" onclick="ownerPin('${esc(m.id)}')">📌 ${m.pinned?'Unpin':'Pin'}</button>`:''}${showSelfEdit?`<button class="btn" style="padding:3px 6px;font-size:11px" onclick="editOwnMessage('${esc(m.id)}')">Edit</button><button class="btn danger" style="padding:3px 6px;font-size:11px" onclick="deleteOwnMessage('${esc(m.id)}')">Delete</button>`:''}${canStaff?`<button class="btn" style="padding:3px 6px;font-size:11px" onclick="staffEdit('${esc(m.id)}')">Edit</button><button class="btn danger" style="padding:3px 6px;font-size:11px" onclick="staffDelete('${esc(m.id)}')">Delete</button>`:''}</div><div class="text">${esc(m.text)}</div>${showOriginal?`<button class="btn" style="padding:3px 7px;font-size:11px;margin-top:5px" onclick="toggleOriginal('${esc(m.id)}')">See original text</button><div id="orig_${esc(m.id)}" class="muted" style="display:none;margin-top:5px">Original: ${esc(m.originalText)}</div>`:''}${renderAttachments(m.attachments||[])}</div></div>`}).join('');if(wasNearBottom)$('messages').scrollTop=$('messages').scrollHeight;else $('messages').scrollTop=oldScroll}
function renderAttachments(a){return a.map(x=>{if(x.kind==='image')return `<img class="attachment" src="${x.data}" alt="${esc(x.name||'image')}">`;if(x.kind==='video')return `<video class="attachment" controls src="${x.data}"></video>`;if(x.kind==='audio')return `<audio controls src="${x.data}" style="margin-top:7px;max-width:360px"></audio>`;return `<div class="fileCard"><span>📎</span><a href="${x.data}" download="${esc(x.name||'file')}">${esc(x.name||'file')}</a></div>`}).join('')}

function previewFiles(files){pendingFiles=[];$('preview').innerHTML='';Array.from(files).slice(0,5).forEach(file=>{const r=new FileReader;r.onload=()=>{const kind=file.type.startsWith('image/')?'image':file.type.startsWith('video/')?'video':file.type.startsWith('audio/')?'audio':'file';pendingFiles.push({name:file.name,type:file.type,data:r.result,kind});$('preview').innerHTML=pendingFiles.map((x,i)=>`<div class="preview"><span>${x.kind==='image'?'🖼️':x.kind==='video'?'🎬':x.kind==='audio'?'🎵':'📎'}</span><span>${esc(x.name)}</span><button onclick="pendingFiles.splice(${i},1);previewRender()">✕</button></div>`).join('')};r.readAsDataURL(file)});}
function previewRender(){$('preview').innerHTML=pendingFiles.map((x,i)=>`<div class="preview"><span>📎</span><span>${esc(x.name)}</span><button onclick="pendingFiles.splice(${i},1);previewRender()">✕</button></div>`).join('')}
async function sendMessage(){const text=$('messageInput').value.trim();if(!token)return toast('Please log in first.');if(!text&&!pendingFiles.length)return;const s=currentServer();if(!s?.id)return toast('Please choose a server first.');try{const r=await fetch('/api/message',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({server:s.id,text,attachments:pendingFiles})});let d={};try{d=await r.json()}catch{}if(!r.ok){if(r.status===401){sessionStore().removeItem(TOKEN_KEY);token='';account=null;showAuth();return toast('Your session expired. Please log in again.')}throw Error(d.error||'Message could not be sent.');}$('messageInput').value='';pendingFiles=[];$('preview').innerHTML='';await sync()}catch(e){toast(e.message||'Message could not be sent.')}}
function toggleEmoji(){const b=$('emojiBar');b.classList.toggle('show');if(!b.classList.contains('show'))return;const owned=(account.inventory||[]).filter(x=>x.startsWith('emoji:')).map(x=>x.slice(6));const list=owned.length?owned:emojis;b.innerHTML=list.map(e=>`<button class="emojiBtn" onclick="insertEmoji('${e}')">${e}</button>`).join('')}

async function voiceMessage(){if((account.age??99)<=7)return toast('Voice messages are disabled for accounts age 7 and under.');if(recording){recording.stop();return}if(!navigator.mediaDevices?.getUserMedia)return toast('Your browser does not support microphone recording.');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];const rec=new MediaRecorder(stream);recording=rec;$('micBtn').textContent='⏹️';rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());$('micBtn').textContent='🎙️';recording=null;const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});const r=new FileReader;r.onload=async()=>{pendingFiles=[{name:'voice-message.webm',type:blob.type,data:r.result,kind:'audio'}];await sendMessage()};r.readAsDataURL(blob)};rec.start();toast('Recording... click the mic again to send.')}catch(e){toast('Microphone permission was not allowed.')}}

function accountSwitcher(){toggleMenu();const q=JSON.parse(localStorage.getItem(QUICK_KEY)||'[]').filter(x=>!['modimanoob','adminimanoob','serveradminimanoob'].includes(String(x.username||'').toLowerCase()));localStorage.setItem(QUICK_KEY,JSON.stringify(q));modal(`<h2>👥 Switch Accounts</h2><p class="muted">Quick Sign In keeps the saved accounts available without signing out of the whole app first.</p>${q.map(x=>`<div class="friendRow"><span class="avatar">${initials(x.name)}</span><b>${esc(x.name)}</b><span class="spacer"></span><button class="btn primary" onclick="quickLogin('${esc(x.token)}')">Switch</button><button class="btn danger" onclick="removeQuick('${esc(x.username)}');accountSwitcher()">Remove</button></div>`).join('')||'<p class="muted">No Quick Sign In accounts saved yet.</p>'}<button class="btn" onclick="closeModal();toggleMenu();setAuthMode('register');$('app').classList.add('hidden');$('auth').classList.remove('hidden')">＋ Create another account</button>`)}

async function setBackground(id){const locked=shopItems.some(x=>x[0]===id)&&!(account.inventory||[]).includes(id);if(locked)return toast('Buy that background in the shop first.');const r=await fetch('/api/background',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id})});const d=await r.json();if(!r.ok)return toast(d.error);account.background=id;applyBackground();closeModal();toast('Background saved.')}

async function createServer(){const name=prompt('Give your server a name:');if(!name)return;const locked=confirm('Make this server private with a code?');let code='';if(locked){code=prompt('Choose a server code (4+ characters):')||'';if(code.length<4)return toast('Code must be at least 4 characters.')}const r=await fetch('/api/server',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({name,private:locked,code})});const d=await r.json();if(!r.ok)return toast(d.error);await sync();serverId=d.server.id;render();toast('Server created!')}

function openUser(username){let p=(account.membersByServer?.[currentServer()?.id]||[]).find(x=>x.username===username)||account.contacts?.find(x=>x.username===username);if(!p&&username===account.username)p=account;if(!p)return;modal(`<h2>${esc(p.name)} ${p.isOwner?'<span class="ownerTag">OWNER</span>':''}</h2><div class="avatar" style="width:70px;height:70px">${avatarHTML(p)}</div><p>${esc(p.description||'No description yet.')}</p>${username!==account.username?`<button class="btn primary" onclick="sendFriend('${esc(username)}')">＋ Friend Request</button><button class="btn" onclick="openDM('${esc(username)}')">💬 DM</button>`:'<div class="muted">This is your profile.</div>'}`)}

async function loadDMRequests(){const r=await fetch('/api/dm/requests',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const d=await r.json();const el=$('dmReqList');if(el)el.innerHTML=(d.requests||[]).map(x=>`<div class="friendRow"><span class="avatar">${avatarHTML(x)}</span><b>${esc(x.name)}</b><span class="spacer"></span><button class="btn primary" onclick="acceptDM('${esc(x.username)}')">Accept DM</button></div>`).join('')||'<span class="muted">No DM requests.</span>'}

async function openDM(u){closeModal();const isFriend=(account.contacts||[]).some(x=>x.username===u);const other=(account.contacts||[]).find(x=>x.username===u)||{name:u};if(!isFriend){modal(`<h2>💬 DM Request</h2><p>You and <b>${esc(other.name)}</b> aren't friends yet.</p><p class="muted">Send a request first. Once they accept, you can DM each other anytime.</p><button class="btn primary" onclick="requestDM('${esc(u)}')">Send DM Request</button>`);return}modal(`<h2>💬 DM with ${esc(other.name)}</h2><div id="dmBox" class="dmBox"></div><div class="dmComposer"><input id="dmInput" class="field" placeholder="Write a private message..." onkeydown="if(event.key==='Enter')sendDM('${esc(u)}')"><button class="btn primary" onclick="sendDM('${esc(u)}')">Send</button></div>`);await refreshDM(u);if(dmTimer)clearInterval(dmTimer);dmTimer=setInterval(()=>refreshDM(u),1000)}
async function requestDM(u){const r=await fetch('/api/dm/request',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({to:u})});const d=await r.json();if(!r.ok)return toast(d.error);toast(d.message||'DM request sent.');closeModal()}

function formatTM(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
async function tmStatus(){const r=await fetch('/api/time-machine/status',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const d=await r.json();account.timeMachine=d.pending;account.pointsMultiplier=d.multiplier;account.pointsMultiplierUntil=d.multiplierUntil;renderTMTimer();if(d.pending&&Date.now()>=Number(d.pending.readyAt)) showTMReady()}
function renderTMTimer(){let el=$('tmTimer');const tm=account?.timeMachine;if(!tm){if(el)el.remove();if(tmPoll){clearInterval(tmPoll);tmPoll=null}return}if(!el){el=document.createElement('div');el.id='tmTimer';el.className='timeMachineTimer';document.body.appendChild(el)}const remain=Number(tm.readyAt)-Date.now();el.innerHTML=remain>0?`<b>⏳ ${esc(tm.label)} charging</b><div class="tmTime">${formatTM(remain)}</div><div class="muted">Your Time Machine will be ready soon.</div>`:`<b class="tmDone">⚡ Time Machine ready!</b><div class="tmTime">00:00</div><button class="btn primary full" onclick="showTMReady()">Play Heads or Tails</button>`;if(!tmPoll)tmPoll=setInterval(renderTMTimer,1000)}
function showTMReady(){if(!account?.timeMachine||Date.now()<Number(account.timeMachine.readyAt))return;modal(`<h2>⏳ ${esc(account.timeMachine.label)}</h2><p class="muted">Heads or Tails is a visual challenge. Your purchase is not a wager: the multiplier reward is guaranteed after the flip.</p><div id="tmCoin" class="coin">COIN</div><div class="tmChoice"><button class="btn primary" onclick="flipTM('HEADS')">Heads</button><button class="btn primary" onclick="flipTM('TAILS')">Tails</button></div><div id="tmResult" class="muted" style="text-align:center;margin-top:10px"></div>`)}

s guaranteed and non-wagering.</p><div class="modalGrid">${timeMachineTiers.map(x=>{const staff=['owner','mod','admin','server-admin'].includes(String(account?.role||''));return `<div class="shopItem"><h3>${x[3]}</h3><div class="muted">${x[2]}× points for 60 minutes</div><p class="price">★ ${x[1].toLocaleString()} pts</p><button class="btn primary" onclick="startTM('${x[0]}',${x[1]})" ${account.timeMachine?'disabled':''}>${account.timeMachine?'Another machine is charging':staff?'⚡ Start instantly':'Start Time Machine'}</button></div>`}).join('')}</div>`)}

async function exchangePD(direction){const amount=direction==='pointsToDiamonds'?Number($('pdPts')?.value||0):Number($('pdDia')?.value||0);const r=await fetch('/api/diamonds/exchange',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({direction,amount})});const d=await r.json();if(!r.ok)return toast(d.error);account.points=d.points;account.diamonds=d.diamonds;renderPoints();toast(direction==='pointsToDiamonds'?`Converted ${amount} points into ${d.changedDiamonds} diamonds.`:`Converted ${amount} diamonds into ${d.changedPoints} points.`);showPDExchange()}

async function buy(id,cost,encoded=false){if(encoded)id=decodeURIComponent(id);const r=await fetch('/api/shop/buy',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({item:id,cost})});const d=await r.json();if(!r.ok)return toast(d.error);account.points=d.points??account.points;await sync();showShop();toast(d.message)}
async function ownerDiamondShop(){toggleMenu();const r=await fetch('/api/players',{headers:{Authorization:'Bearer '+token}});const d=await r.json();const users=[account,...(d.accounts||[])];const targetOptions=users.map(u=>`<option value="${esc(u.username)}">${esc(u.name)} (@${esc(u.username)})</option>`).join('');const ownedBgOptions=backgrounds.filter(b=>b[0]!=='default'&&(account.inventory||[]).includes(b[0])).map(b=>`<option value="${esc(b[0])}">${esc(b[1])}</option>`).join('')||'<option value="">No transferable backgrounds</option>';const srvOptions=(account.servers||[]).filter(s=>!s.isUpdateLog&&s.members?.includes(account.username)).map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');modal(`<h2>💎 Owners Shop</h2><p class="muted">Everyone can use this shop. Balance: <b>${account.diamonds||0} 💎</b></p><div class="modalGrid"><div class="shopItem"><h3>⚡ Instant Server Admin — 15 min</h3><p class="price">15 💎</p><select id="osTarget1" class="field">${targetOptions}</select><select id="osServer1" class="field">${srvOptions||'<option value="">No eligible servers</option>'}</select><button class="btn primary" onclick="ownerBuy('serverAdmin15')">Buy & Activate</button></div><div class="shopItem"><h3>📢 Server Announcement</h3><p class="price">8 💎</p><select id="osServer2" class="field">${srvOptions||'<option value="">No eligible servers</option>'}</select><textarea id="osText2" class="field" rows=3 placeholder="Announcement..."></textarea><button class="btn primary" onclick="ownerBuy('serverAnnounce')">Broadcast</button></div><div class="shopItem"><h3>🌎 Global Broadcast</h3><p class="price">20 💎</p><textarea id="osText3" class="field" rows=3 placeholder="Global message..."></textarea><button class="btn primary" onclick="ownerBuy('globalBroadcast')">Broadcast Everywhere</button></div><div class="shopItem"><h3>✨ 2× Points — 30 min</h3><p class="price">25 💎</p><select id="osTarget4" class="field">${targetOptions}</select><button class="btn primary" onclick="ownerBuy('doublePoints30')">Use / Give</button></div><div class="shopItem"><h3>🎁 Transfer 1,000 Points</h3><p class="price">10 💎</p><select id="osTarget5" class="field">${targetOptions}</select><button class="btn primary" onclick="ownerBuy('giftPoints1000')">Transfer</button></div><div class="shopItem"><h3>🎨 Transfer a Background</h3><p class="price">12 💎</p><select id="osTarget6" class="field">${targetOptions}</select><select id="osBg6" class="field">${ownedBgOptions}</select><button class="btn primary" onclick="ownerBuy('unlockBackground')">Transfer</button></div><div class="shopItem"><h3>⚡ 2× Points — 15 min</h3><p class="price">10 💎</p><select id="osTarget8" class="field">${targetOptions}</select><button class="btn primary" onclick="ownerBuy('pointsBoost15')">Use / Give</button></div><div class="shopItem"><h3>🚀 2× Points — 60 min</h3><p class="price">35 💎</p><select id="osTarget9" class="field">${targetOptions}</select><button class="btn primary" onclick="ownerBuy('pointsBoost60')">Use / Give</button></div><div class="shopItem"><h3>🕐 Server Admin — 60 min</h3><p class="price">45 💎</p><select id="osTarget10" class="field">${targetOptions}</select><select id="osServer10" class="field">${srvOptions||'<option value="">No eligible servers</option>'}</select><button class="btn primary" onclick="ownerBuy('serverAdmin60')">Buy & Activate</button></div><div class="shopItem"><h3>🌎 Global Broadcast — 60 sec</h3><p class="price">40 💎</p><textarea id="osText11" class="field" rows=3 placeholder="Global message..."></textarea><button class="btn primary" onclick="ownerBuy('globalBroadcast60')">Broadcast</button></div><div class="shopItem"><h3>🎁 Transfer 500 Points</h3><p class="price">6 💎</p><select id="osTarget12" class="field">${targetOptions}</select><button class="btn primary" onclick="ownerBuy('transferPoints500')">Transfer</button></div><div class="shopItem"><h3>🚀 2× Points — 120 min</h3><p class="price">55 💎</p><select id="osTarget14" class="field">${targetOptions}</select><button class="btn primary" onclick="ownerBuy('pointsBoost120')">Use / Give</button></div><div class="shopItem"><h3>🕐 Server Admin — 120 min</h3><p class="price">75 💎</p><select id="osTarget15" class="field">${targetOptions}</select><select id="osServer15" class="field">${srvOptions||'<option value="">No eligible servers</option>'}</select><button class="btn primary" onclick="ownerBuy('serverAdmin120')">Buy & Activate</button></div><div class="shopItem"><h3>🎲 Diamond Drop — 1×–10× for 5 min</h3><p class="price">10 💎</p><p class="muted">Randomly activates a 1× to 10× points multiplier for 5 minutes.</p><button class="btn primary" onclick="ownerBuy('diamondDrop')">Open Drop</button></div><div class="shopItem"><h3>🕒 AFK Grace for Today</h3><p class="price">1 💎 = 1 minute</p><p class="muted">Choose how many extra AFK minutes you want for today.</p><input id="osAfkMinutes" class="field" type="number" min="1" max="1440" step="1" placeholder="Minutes"><button class="btn primary" onclick="ownerBuy('afkGraceDay')">Buy Grace</button></div><div class="shopItem"><h3>👑 Owner Panel — 10 sec</h3><p class="price">100,000 💎 + 50,000 ⭐</p><p class="muted">Grind for the real Owner Panel for 5 seconds. Use the controls before it disappears.</p><button class="btn primary" onclick="ownerBuy('ownerPanelTroll')">Troll Me 👑</button></div><div class="shopItem"><h3>⏱️ Time Machine Instant Finish</h3><p class="price">60 💎</p><button class="btn primary" onclick="ownerBuy('timeMachineInstant')">Use on myself</button></div></div>`)}
async function ownerBuy(item){const body={item};if(item==='serverAdmin15'){body.target=$('osTarget1').value;body.server=$('osServer1').value}else if(item==='serverAnnounce'){body.server=$('osServer2').value;body.text=$('osText2').value}else if(item==='globalBroadcast'){body.text=$('osText3').value}else if(item==='doublePoints30'){body.target=$('osTarget4').value}else if(item==='giftPoints1000'){body.target=$('osTarget5').value}else if(item==='unlockBackground'){body.target=$('osTarget6').value;body.background=$('osBg6').value}else if(item==='pointsBoost15'){body.target=$('osTarget8').value}else if(item==='pointsBoost60'){body.target=$('osTarget9').value}else if(item==='serverAdmin60'){body.target=$('osTarget10').value;body.server=$('osServer10').value}else if(item==='globalBroadcast60'){body.text=$('osText11').value}else if(item==='transferPoints500'){body.target=$('osTarget12').value}else if(item==='pointsBoost120'){body.target=$('osTarget14').value}else if(item==='serverAdmin120'){body.target=$('osTarget15').value;body.server=$('osServer15').value}else if(item==='afkGraceDay'){body.amount=Math.floor(Number($('osAfkMinutes').value||0))}const r=await fetch('/api/owner-shop/buy',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)return toast(d.error);account.diamonds=d.diamonds;renderPoints();await sync();ownerDiamondShop();toast(d.dropMultiplier?`${d.message} You rolled ${d.dropMultiplier}× for 5 minutes.`:d.message);if(item==='ownerPanelTroll')showOwnerPanelPreview(5)}
async function ownerGiveDiamonds(){const target=($('odUser')?.value||account.username).trim().toLowerCase(),amount=Number($('odAmount')?.value||0);const r=await fetch('/api/owner/diamonds',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({target,amount})});const d=await r.json();if(!r.ok)return toast(d.error);toast(`Gave ${amount} 💎 to ${target}.`);if(target===account.username){account.diamonds=d.diamonds;renderPoints()}}
async function ownerPanel(){if(!(account?.isOwner||account?.isCoOwner||Number(account?.ownerPanelTrialRemainingMs||0)>0))return toast('Owner Panel access is not active.');toggleMenu();const serverOptions=(account.servers||[]).map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');modal(`<h2>👑 Owner Panel</h2><p class="muted">${account.isOwner?'Full owner control.':account.isCoOwner?`Co-Owner control · grant pool: ${account.coOwnerPointGrantRemaining??5000} ⭐ and ${account.coOwnerDiamondGrantRemaining??300} 💎.`:'Temporary Owner Panel access · <span class="trialBadge">5s</span>'}</p><div class="modalGrid"><div><h3>⭐ Give / remove points</h3><input id="opUser" class="field" placeholder="Username"><input id="opAmount" class="field" type="number" placeholder="Points (e.g. 500)"><button class="btn primary" onclick="ownerPoints()">Apply Points</button></div><div><h3>📢 Server-wide message</h3><select id="oaServer" class="field" onchange="loadOwnerAnnouncement()">${serverOptions}</select><textarea id="oaText" class="field" rows="4" maxlength="500" placeholder="Message everyone in this server..."></textarea><div style="display:flex;gap:7px"><button class="btn primary" onclick="ownerAnnouncement()">Display Message</button><button class="btn danger" onclick="ownerClearAnnouncement()">Clear</button><button class="btn" onclick="ownerGlobalBroadcast()">🌎 Broadcast to EVERY server</button></div><div id="ownerAnnouncementStatus"></div></div></div><div class="modalGrid"><div><h3>💎 Give Diamonds</h3><input id="odUser" class="field" placeholder="Username (blank = yourself)"><input id="odAmount" class="field" type="number" min="1" placeholder="Diamonds"><button class="btn primary" onclick="ownerGiveDiamonds()">Give Diamonds</button></div></div><h3>⚙️ Player & Rank Settings</h3><div class="staffSearch"><input id="roleSearch" class="field" placeholder="Search players by name or username" oninput="searchOwnerPlayers()"><button class="btn" onclick="searchOwnerPlayers()">Search</button></div><div id="ownerAccounts" style="margin-top:10px"></div><h3>Recent messages</h3><button class="btn" onclick="loadOwnerMessages()">Refresh Messages</button><div id="ownerContent" style="margin-top:12px"></div>`);loadOwnerAccounts('');loadOwnerMessages();loadOwnerAnnouncement()}
async function searchOwnerPlayers(){loadOwnerAccounts($('roleSearch')?.value||'')}
async function loadOwnerAccounts(q=''){const r=await fetch('/api/owner/search?q='+encodeURIComponent(q),{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const d=await r.json();const servers=(account.servers||[]).filter(s=>!s.isUpdateLog);$('ownerAccounts').innerHTML=d.accounts.map(x=>{const role=x.isOwner?'OWNER':(x.role||'user').toUpperCase();const serverOpts=servers.map(s=>`<option value="${esc(s.id)}" ${x.serverAdminServerId===s.id?'selected':''}>${esc(s.name)}</option>`).join('');return `<div class="ownerItem" style="padding:10px 0;border-bottom:1px solid #263247"><div style="display:flex;align-items:center;gap:8px"><span class="avatar">${avatarHTML(x)}</span><div><b>${esc(x.name)}</b><div class="muted">@${esc(x.username)} · ${role}${x.role==='server-admin'&&x.serverAdminRemainingMs?` · ${Math.ceil(x.serverAdminRemainingMs/60000)}m left`:''}</div></div><span class="spacer"></span><span class="price">${x.points||0} pts</span></div>${!x.isOwner?`<div style="display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap"><select id="role_${esc(x.username)}" class="field" style="max-width:180px"><option value="user">User</option><option value="mod" ${x.role==='mod'?'selected':''}>MOD</option><option value="admin" ${x.role==='admin'?'selected':''}>ADMIN</option><option value="server-admin" ${x.role==='server-admin'?'selected':''}>SERVER ADMIN</option><option value="co-owner" ${x.role==='co-owner'?'selected':''}>CO-OWNER</option></select><select id="srv_${esc(x.username)}" class="field" style="max-width:220px">${serverOpts||'<option value="">No servers</option>'}</select><button class="btn primary" onclick="setRole('${esc(x.username)}')">Save Rank</button>${account.isOwner?`<button class="btn" onclick="ownerKick('${esc(x.username)}')">👢 Kick</button><button class="btn danger" onclick="ownerBan('${esc(x.username)}')">🚫 Ban</button>${x.banUntil&&Number(x.banUntil)>Date.now()?`<button class="btn" onclick="ownerUnban('${esc(x.username)}')">🔓 Unban</button>`:''}`:''}</div>`:''}</div>`}).join('')||'<p class="muted">No players found.</p>'}
async function setRole(username){const role=$('role_'+username)?.value||'user',serverId=$('srv_'+username)?.value||'';const r=await fetch('/api/owner/role',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({username,role,serverId})});const d=await r.json();if(!r.ok)return toast(d.error);toast(role==='server-admin'?'🕐 Server Admin granted for 1 hour.':role==='co-owner'?'👑 Co-Owner granted. Their grant pool is 5,000 points + 300 diamonds.':role==='user'?'Rank removed.':'Rank set to '+role.toUpperCase()+'.');loadOwnerAccounts($('roleSearch')?.value||'');sync()}
async function staffPanel(){if(account?.isOwner)return toast('Owner uses the Owner Panel.');toggleMenu();const role=account.role;const servers=(account.servers||[]).filter(s=>!s.isUpdateLog&& (role!=='server-admin'||s.id===account.serverAdminServerId));const opts=servers.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');modal(`<h2>${role==='server-admin'?'🕐 Server Admin':role==='admin'?'🧰 Admin':'🛡️ MOD'} Panel</h2><div id="staffStatus" class="muted">Loading limits...</div><div class="modalGrid"><div><h3>📢 Announcement</h3><select id="maServer" class="field" onchange="loadStaffMembers();loadStaffMessages()">${opts||'<option value="">No allowed servers</option>'}</select><textarea id="maText" class="field" rows="4" maxlength="500" placeholder="Message everyone in this server..."></textarea><button class="btn primary" onclick="modAnnouncement()">Display Message</button></div><div><h3>👥 Server members</h3><div id="staffMembers"></div></div></div><h3>🧹 Recent messages</h3><div id="staffMessages"></div>`);await loadStaffStatus();await loadStaffMembers();await loadStaffMessages()}
async function modAnnouncement(){const server=$('maServer')?.value,text=$('maText')?.value.trim();if(!server)return toast('Choose a server first.');if(!text)return toast('Type an announcement first.');const r=await fetch('/api/owner/announcement',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({server,text})});const d=await r.json();if(!r.ok)return toast(d.error);$('maText').value='';await sync();loadStaffStatus();toast('📢 Announcement displayed!')}
async function loadStaffStatus(){const r=await fetch('/api/staff/status',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const d=await r.json();let text=`📢 ${d.announcementRemaining??0} announcements left · 🧹 ${d.moderationRemaining??0} edit/delete actions left · 👥 ${d.removeMemberRemaining??0} member removals left`;if(d.role==='server-admin')text+=` · ⏱️ ${Math.ceil((d.serverAdminRemainingMs||0)/60000)} minutes left`;if($('staffStatus'))$('staffStatus').textContent=text}
async function loadStaffMembers(){const sid=$('maServer')?.value;if(!sid||!$('staffMembers'))return;const list=account.membersByServer?.[sid]||[];$('staffMembers').innerHTML=list.map(x=>`<div class="ownerItem" style="display:flex;gap:7px;align-items:center;margin:5px 0"><span class="avatar">${avatarHTML(x)}</span><b>${esc(x.name)}</b><span class="muted">${x.role||'user'}</span><span class="spacer"></span>${x.username!==account.username&&x.username!==currentServer()?.owner?`<button class="btn danger" onclick="staffRemove('${esc(sid)}','${esc(x.username)}')">Remove</button>`:''}</div>`).join('')||'<p class="muted">No members.</p>'}
async function loadStaffMessages(){const sid=$('maServer')?.value;if(!sid||!$('staffMessages'))return;const r=await fetch('/api/staff/messages?server='+encodeURIComponent(sid),{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)return $('staffMessages').innerHTML=`<p class="muted">${esc(d.error)}</p>`;$('staffMessages').innerHTML=(d.messages||[]).map(m=>`<div class="ownerItem" style="margin:6px 0"><b>${esc(m.name)}</b> <span class="time">${esc(m.time)}</span><div>${esc(m.text||'[attachment]')}</div><div style="margin-top:6px"><button class="btn" onclick="staffEdit('${esc(m.id)}')">Edit</button> <button class="btn danger" onclick="staffDelete('${esc(m.id)}')">Delete</button></div></div>`).join('')||'<p class="muted">No messages yet.</p>'}
async function staffRemove(server,username){if(!confirm('Remove this player from the server?'))return;const r=await fetch('/api/staff/remove-member',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({server,username})});const d=await r.json();if(!r.ok)return toast(d.error);await sync();loadStaffMembers();loadStaffStatus();toast('Player removed from the server.')}
async function editOwnMessage(id){const m=(account.messages||[]).find(x=>x.id===id);if(!m)return;const text=prompt('Edit your message:',m.text);if(text===null||text.trim()===m.text)return;if(!text.trim())return toast('Message cannot be empty.');const r=await fetch('/api/message/edit',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id,text:text.trim()})});const d=await r.json();if(!r.ok)return toast(d.error);await sync();toast('Message edited.');}
async function deleteOwnMessage(id){if(!confirm('Delete your message?'))return;const r=await fetch('/api/message/delete',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id})});const d=await r.json();if(!r.ok)return toast(d.error);await sync();toast('Message deleted.')}
function toggleOriginal(id){const el=$('orig_'+id);if(el)el.style.display=el.style.display==='none'?'block':'none'}
async function staffEdit(id){const text=prompt('New message text:');if(text===null)return;const r=await fetch(account.isOwner?'/api/owner/edit-message':'/api/staff/edit-message',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id,text})});const d=await r.json();if(!r.ok)return toast(d.error);await sync();if($('staffMessages'))loadStaffMessages();if($('ownerContent'))loadOwnerMessages();toast('Message edited.')}
async function staffDelete(id){if(!confirm('Delete this message?'))return;const r=await fetch(account.isOwner?'/api/owner/delete-message':'/api/staff/delete-message',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id})});const d=await r.json();if(!r.ok)return toast(d.error);await sync();if($('staffMessages'))loadStaffMessages();if($('ownerContent'))loadOwnerMessages();toast('Message deleted.')}
function showOwnerPanelPreview(seconds){const endAt=Date.now()+seconds*1000;ownerPanel();const timer=setInterval(()=>{const left=Math.max(0,endAt-Date.now());const badge=document.querySelector('.modal .trialBadge');if(badge)badge.textContent=`Temporary Owner Panel · ${Math.ceil(left/1000)}s`;if(left<=0){clearInterval(timer);closeModal();toast('👑 Owner Panel trial ended.')}} ,250)}
async function loadOwnerAnnouncement(){const sid=$('oaServer')?.value;if(!sid)return;const a=account.announcements?.[sid];if($('oaText'))$('oaText').value=a?.text||'';if($('ownerAnnouncementStatus'))$('ownerAnnouncementStatus').innerHTML=a?`<div class="ownerAnnouncement"><b>📢 Currently displayed</b><div>${esc(a.text)}</div></div>`:'<p class="muted">No announcement is currently displayed.</p>'}
async function ownerAnnouncement(){const server=$('oaServer').value,text=$('oaText').value.trim();if(!text)return toast('Type a server-wide message first.');const r=await fetch('/api/owner/announcement',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({server,text})});const d=await r.json();if(!r.ok)return toast(d.error);await sync();loadOwnerAnnouncement();toast('📢 Server-wide message displayed!')}
async function ownerClearAnnouncement(){const server=$('oaServer').value;const r=await fetch('/api/owner/announcement/clear',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({server})});const d=await r.json();if(!r.ok)return toast(d.error);await sync();loadOwnerAnnouncement();toast('Server-wide message cleared.')}
async function ownerGlobalBroadcast(){const text=prompt('Broadcast to every server (shown for 10 seconds):');if(!text?.trim())return;const r=await fetch('/api/owner/broadcast',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({text:text.trim()})});const d=await r.json();if(!r.ok)return toast(d.error);await sync();toast('🌎 Broadcast sent to every server.')}
async function ownerPin(id){const r=await fetch('/api/owner/pin-message',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id})});const d=await r.json();if(!r.ok)return toast(d.error);await sync();if($('ownerContent'))loadOwnerMessages();toast(d.pinned?'📌 Message pinned.':'Message unpinned.')}
async function ownerKick(username){const chosen=prompt('Server ID to kick them from:',window.serverId||serverId||'');const serverId=chosen||window.serverId||'';if(!serverId)return;const r=await fetch('/api/owner/kick',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({username,server:serverId})});const d=await r.json();if(!r.ok)return toast(d.error);await sync();loadOwnerAccounts($('roleSearch')?.value||'');toast('👢 '+d.message)}
async function ownerUnban(username){if(!confirm('Unban '+username+'?'))return;const r=await fetch('/api/owner/unban',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({username})});const d=await r.json();if(!r.ok)return toast(d.error);loadOwnerAccounts($('roleSearch')?.value||'');toast('🔓 '+d.message)}
async function ownerBan(username){const raw=prompt('Ban duration in minutes. Enter 0 for permanent:','10');if(raw===null)return;const minutes=Number(raw);if(!Number.isFinite(minutes)||minutes<0)return toast('Enter 0 or a positive number.');const reason=prompt('Reason (optional):','Rule violation')||'';if(!confirm(`Ban ${username} ${minutes===0?'permanently':'for '+minutes+' minute(s)'}?`))return;const r=await fetch('/api/owner/ban',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({username,minutes,reason})});const d=await r.json();if(!r.ok)return toast(d.error);loadOwnerAccounts($('roleSearch')?.value||'');toast('🚫 '+d.message)}
function showBanScreen(until,reason){if(window.banTimer)clearInterval(window.banTimer);const permanent=!until||Number(until)===0;modal(`<h2 style="font-size:28px">🚫 You are banned</h2><p class="muted">You cannot use LCA while this ban is active.</p><div id="banCountdown" style="font-size:34px;font-weight:900;margin:18px 0">${permanent?'PERMANENT':'Calculating...'}</div>${reason?`<div class="ownerItem"><b>Reason</b><div>${esc(reason)}</div></div>`:''}<p class="muted">If the timer reaches zero, you can log in again.</p>`);if(!permanent){const tick=()=>{const left=Math.max(0,Number(until)-Date.now());if(left<=0){clearInterval(window.banTimer);window.banTimer=null;closeModal();$('authMsg').textContent='Your ban has expired. You can log in again.';return}const sec=Math.ceil(left/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),ss=sec%60;$('banCountdown').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`};tick();window.banTimer=setInterval(tick,250)}}
async function ownerPoints(){const r=await fetch('/api/owner/points',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({username:$('opUser').value,amount:Number($('opAmount').value)})});const d=await r.json();toast(d.message||d.error);loadOwnerAccounts()}
async function loadOwnerMessages(){const r=await fetch('/api/owner/messages',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const d=await r.json();$('ownerContent').innerHTML=d.messages.map(m=>`<div class="ownerItem" style="margin:6px 0"><div><b>${esc(m.name)}</b> <span class="time">${esc(m.time)}</span></div><div class="text">${esc(m.text||'[attachment]')}</div><div style="margin-top:6px"><button class="btn" onclick="ownerEdit('${esc(m.id)}')">Edit</button> <button class="btn danger" onclick="ownerDelete('${esc(m.id)}')">Delete</button> <button class="btn" onclick="ownerPin('${esc(m.id)}')">📌 ${m.pinned?'Unpin':'Pin'}</button></div></div>`).join('')||'<p class="muted">No messages yet.</p>'}
async function ownerEdit(id){return staffEdit(id)}; async function legacyOwnerEdit(id){const text=prompt('New message text:');if(text===null)return;const r=await fetch('/api/owner/edit-message',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id,text})});const d=await r.json();toast(d.error||'Message edited.');sync();if($('ownerContent'))loadOwnerMessages()}
async function ownerDelete(id){return staffDelete(id)}; async function legacyOwnerDelete(id){if(!confirm('Delete this message?'))return;const r=await fetch('/api/owner/delete-message',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id})});const d=await r.json();toast(d.error||'Message deleted.');sync();if($('ownerContent'))loadOwnerMessages()}
function modal(content){if(dmTimer){clearInterval(dmTimer);dmTimer=null}$('modalRoot').innerHTML=`<div class="modalWrap" onclick="if(event.target.classList.contains('modalWrap'))closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){if(dmTimer){clearInterval(dmTimer);dmTimer=null}$('modalRoot').innerHTML=''}
function toast(text){const x=document.createElement('div');x.className='toast';x.textContent=text;document.body.appendChild(x);setTimeout(()=>x.remove(),2400)}
async function logout(){try{await fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+token}})}catch(e){}sessionStore().removeItem(TOKEN_KEY);localStorage.removeItem(TOKEN_KEY);token='';account=null;if(poll)clearInterval(poll);if(rewardTimer)clearInterval(rewardTimer);$('app').classList.add('hidden');$('auth').classList.remove('hidden');setAuthMode('login');$('authName').value='';$('authPass').value='';$('authMsg').textContent='You are fully logged out.';renderQuick()}
async function boot(){
  populateDob();setAuthMode('login');
  if(token){
    for(let attempt=0;attempt<3;attempt++){
      try{
        const r=await fetch('/api/snapshot',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
        if(r.ok){
          const d=await r.json();account=d.account;showApp();return;
        }
        if(r.status===403){
          const d=await r.json().catch(()=>({}));
          if(d.banned){showBanScreen(d.banUntil,d.banReason||'');return;}
          break;
        }
        if(r.status===401)break;
      }catch(e){}
      await new Promise(resolve=>setTimeout(resolve,350));
    }
    sessionStore().removeItem(TOKEN_KEY);token='';
  }
  renderQuick();
}
boot();
</script>
